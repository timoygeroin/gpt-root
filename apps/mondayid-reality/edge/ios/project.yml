name: MondayIDReality
options:
  bundleIdPrefix: com.mondayid
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGNING_ALLOWED: NO
targets:
  MondayIDReality:
    type: application
    platform: iOS
    sources:
      - path: MondayIDRealityEdge
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mondayid.reality
        PRODUCT_NAME: MONDAYID REALITY
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
