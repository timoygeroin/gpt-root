<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MONDAYID REALITY</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color-scheme:dark;--bg:#0b0c0e;--fg:#f4f1ea;--muted:#868a91;--hair:rgba(255,255,255,.09);--surface:rgba(255,255,255,.045);--warn:#d4ac65;--red:#f04c43}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--fg);-webkit-font-smoothing:antialiased}.app{min-height:430px;padding:20px 20px 18px;border-radius:24px;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.075),transparent 56%),var(--bg);overflow:hidden;position:relative}.critical{background:radial-gradient(115% 80% at 50% 0%,rgba(224,48,42,.34),transparent 63%),var(--bg)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#777b82;font-weight:750}.demo{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--warn);font-weight:750}.phase{margin-top:52px;font-size:42px;letter-spacing:-.047em;line-height:1.01;font-weight:680;max-width:11ch}.sub{margin-top:13px;color:var(--muted);font-size:14px;line-height:1.5;max-width:38ch}.action{margin-top:20px;font-size:13px;font-weight:650}.zones{margin-top:38px;border-top:1px solid var(--hair)}.zone{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair)}.zname{font-size:15px}.area{display:block;color:#6f737a;font-size:11px;margin-top:3px}.state{display:flex;align-items:center;gap:8px;font-size:11px;color:#858a91}.dot{width:7px;height:7px;border-radius:50%;background:#62666c}.changed .dot{background:var(--warn)}.changed .state{color:#c5a36b}.active .dot{background:var(--red);box-shadow:0 0 0 5px rgba(240,76,67,.12)}.active .state{color:#ff7c74}.incident{margin-top:18px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--hair)}.badge{display:inline-flex;padding:5px 8px;border:1px solid rgba(255,255,255,.14);border-radius:999px;font-size:9px;letter-spacing:.14em;font-weight:750;color:#aaadb2}.incident h3{font-size:16px;margin:11px 0 5px;letter-spacing:-.02em}.instruction{font-size:13px;line-height:1.47;color:#a7aaaf}.delta{margin-top:14px;color:#747980;font-size:11px;line-height:1.5}.sensorline{margin-top:14px;color:#62666d;font-size:10px;line-height:1.45}.actions{display:flex;gap:10px;margin-top:22px}.btn{appearance:none;border:0;border-radius:14px;padding:12px 15px;background:#f1eee8;color:#111214;font-weight:680;font-size:13px;cursor:pointer}.btn:active{transform:scale(.985)}.ghost{background:rgba(255,255,255,.06);color:#a8abb0}.notice{margin-top:16px;font-size:10px;line-height:1.45;color:#5f6369}.meta{margin-top:8px;font-size:9px;color:#4f5359}.error{margin-top:18px;color:#ff8c85;font-size:12px;line-height:1.5}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media (max-width:380px){.phase{font-size:36px}.app{padding-left:17px;padding-right:17px}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"><div class="top"><div class="eyebrow">MONDAYID REALITY</div><div class="demo">SIMULATED</div></div><div class="phase">Loading reality…</div></main>
<script type="module">
const el=document.querySelector('#app');let current=null;let rpcId=0;const pending=new Map();let bridgeReady=null;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`;
function setUiState(s){try{window.openai?.setWidgetState?.({modelContent:`MONDAYID REALITY UI is showing ${s.phase} simulated state.`,privateContent:{scenarioId:s.scenarioId,stateVersion:s.stateVersion,phase:s.phase}})}catch{}}
function render(s){if(!s)return;current=s;el.className='app'+(s.phase==='ACTIVE'?' critical':'');
 const zones=s.zones.map(z=>{const st=s.zoneStates.find(x=>x.zoneId===z.id)?.state||'QUIET';return `<div class="zone ${st.toLowerCase()}"><div><span class="zname">${esc(z.label)}</span><span class="area">${esc(z.area)}</span></div><span class="state">${esc(st)} <i class="dot" aria-hidden="true"></i></span></div>`}).join('');
 const inc=s.incident?`<section class="incident"><span class="badge">${esc(s.incident.truth)} · ${esc(s.incident.lifecycle)}</span><h3>${esc(s.incident.title)}</h3><div class="instruction">${esc(s.incident.instruction)}</div></section>`:'';
 const sensors=s.sensors.map(x=>`${esc(x.label)} · ${esc(x.transport)}`).join('  ·  ');
 el.innerHTML=`<div class="top"><div class="eyebrow">${esc(s.product)}</div><div class="demo">${esc(s.mode)}</div></div><div class="phase">${esc(s.headline)}</div><div class="sub">${esc(s.promise)}</div><div class="action">${esc(s.action.label)}</div><section class="zones" aria-label="Saved zones">${zones}</section>${inc}<div class="delta">${esc(s.delta.text)}</div><div class="sensorline">${sensors}</div><div class="actions"><button class="btn" id="advance" type="button">Next state</button><button class="btn ghost" id="reset" type="button">Quiet</button></div><div class="notice">${esc(s.safetyNotice)}</div><div class="meta">state v${esc(s.stateVersion)} · session ${esc(s.scenarioId.slice(0,8))}</div><div class="sr" id="status">${esc(s.phase)}</div>`;
 document.querySelector('#advance').onclick=()=>transition('next');document.querySelector('#reset').onclick=()=>transition('reset');setUiState(s)
}
function renderError(message){const p=document.createElement('div');p.className='error';p.textContent=message;el.appendChild(p)}
function extract(resp){return resp?.structuredContent||resp?.result?.structuredContent||resp?.params?.structuredContent||resp?.mcp_tool_result?.structuredContent||null}
function update(resp){const sc=extract(resp);if(sc)render(sc);return sc}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;if(typeof m.id==='number'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')update(m.params)});
bridgeReady=request('ui/initialize',{appInfo:{name:'mondayid-reality',version:'0.3.1'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(r=>{notify('ui/notifications/initialized',{});return r}).catch(()=>null);
async function callTool(name,args){await bridgeReady;return window.openai?.callTool?window.openai.callTool(name,args):request('tools/call',{name,arguments:args})}
async function transition(direction){if(!current)return;const buttons=[...el.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{const r=await callTool('transition_demo',{stateToken:current.stateToken,direction,expectedVersion:current.stateVersion,transitionId:uid()});if(!update(r)){const fallback=extract(window.openai?.toolResponseMetadata);if(fallback)render(fallback)}}catch(err){renderError('Could not change the simulated state. The current view was preserved.');console.error(err)}finally{buttons.forEach(b=>b.disabled=false)}}
const initial=window.openai?.toolOutput;if(initial)render(initial);else bridgeReady.then(()=>{if(window.openai?.toolOutput)render(window.openai.toolOutput)});
</script>
</body>
</html>
